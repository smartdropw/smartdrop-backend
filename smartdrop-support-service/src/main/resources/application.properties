spring.application.name=smartdrop-support-service

# Active Profile: Defaults to 'dev' (H2 in-memory)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Microservice Port: 8084
server.port=${PORT:8084}

# Application Information for OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

documentation.application.title=SmartDrop Support API
documentation.application.description=Microservicio de Alertas, Notificaciones Push/SMS y Gestión de Tickets de Soporte
documentation.application.version=1.0.0

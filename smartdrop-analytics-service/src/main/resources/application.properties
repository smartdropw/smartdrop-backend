spring.application.name=smartdrop-analytics-service

# Active Profile: Defaults to 'dev' (H2 in-memory)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Microservice Port: 8083
server.port=${PORT:8083}

# Application Information for OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

documentation.application.title=SmartDrop Analytics API
documentation.application.description=Microservicio de Detección de Anomalías, Fugas Nocturnas, Excursión Térmica y Telemetría
documentation.application.version=1.0.0
